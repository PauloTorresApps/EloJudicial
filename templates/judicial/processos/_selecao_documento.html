{# Toggle de seleção de um documento na tabela de eventos (estilo .elo-switch em tema.css). A seleção inicial vem de judicial/selecao_documentos.py. #}
<input type="checkbox" name="documentos" value="{{ doc.id }}" class="elo-switch"{% if doc.id in documentos_marcados %} checked{% endif %} aria-label="Selecionar {{ doc.nome }}">
