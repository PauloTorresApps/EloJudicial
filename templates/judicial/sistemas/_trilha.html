{% comment %}Trilha de navegação: Sistemas / <sistema> / <ambiente>{% endcomment %}
<nav class="flex flex-row flex-wrap gap-2 items-center mb-4 text-subtle">
    <a href="{% url 'sistemas:lista' %}" class="hover:text-primary-600 dark:hover:text-primary-500">Sistemas</a>
    {% if sistema %}
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        {% if ambiente %}
            <a href="{% url 'sistemas:ambientes' sistema.pk %}" class="hover:text-primary-600 dark:hover:text-primary-500">{{ sistema.nome }}</a>
            <span class="material-symbols-outlined text-sm">chevron_right</span>
            <span class="font-medium text-important">{{ ambiente.descricao }}</span>
        {% else %}
            <span class="font-medium text-important">{{ sistema.nome }}</span>
        {% endif %}
    {% endif %}
</nav>
