# Desenvolvimento: interface do Mailpit em http://<host>:8025/
# (os usuários abrem aqui os e-mails de confirmação de cadastro e recuperação de senha).
upstream elojudicial_mailpit {
    zone elojudicial_mailpit 64k;
    server mailpit:8025 resolve;
}

server {
    listen 8025;
    server_name _;

    location / {
        proxy_pass http://elojudicial_mailpit;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
