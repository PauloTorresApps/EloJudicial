user  nginx;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

# HTTP: sistema web (porta 80 e o HTTPS interno que recebe o tráfego da 443).
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker: os contêineres podem ser recriados e mudar de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}

# TCP: a porta 443 é dividida pelo nome TLS (SNI) entre o sistema, o Postgres e o Redis.
stream {
    log_format  stream  '$remote_addr [$time_local] $ssl_preread_server_name '
                        '$status $bytes_sent $bytes_received $session_time';
    access_log  /dev/stdout  stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/stream-conf.d/*.conf;
}
